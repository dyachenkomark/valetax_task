[project]
name = "valetax-copilot"
version = "0.1.0"
description = "Support-ticket co-pilot for a retail forex/CFD broker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
